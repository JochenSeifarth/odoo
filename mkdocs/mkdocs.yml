site_name: RYA-Benutzerhandbuch
site_description: Benutzerhandbuch für RYA
site_author: Jochen Seifarth
site_url: https://www.real-yachting-alicante.com/hilfe/

theme:
  name: material
  language: de

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

extra_javascript:
  - javascript/numbering.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

nav:
  - Einführung: index.md
  - Buchung: buchung.md
  - Storno: storno.md
